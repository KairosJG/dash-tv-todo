<script>
/* =================== utilidades (ES5) =================== */
var MODO_TV = /[?&]tv/i.test(window.location.search);
document.body.className = MODO_TV ? 'tv' : 'pc';
var CORES = ['#FFC72C', '#4aa3ff', '#3ecf7a', '#c58cff', '#ff8a5c', '#5ad1e8', '#ff6fa5', '#a4d65e', '#ffd166', '#8fa8ff', '#e07be0', '#6ee7b7'];

function trim(s) { return String(s).replace(/^\s+|\s+$/g, ''); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function doisDig(n) { return n < 10 ? '0' + n : '' + n; }
function hojeISO() { var a = new Date(); return a.getFullYear() + '-' + doisDig(a.getMonth() + 1) + '-' + doisDig(a.getDate()); }
function isoParaBR(iso) { var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; }
var DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

function ajax(metodo, caminho, corpo, extras, ok, falha) {
  var x = new XMLHttpRequest();
  x.open(metodo, CONFIG.SUPABASE_URL + caminho, true);
  x.setRequestHeader('apikey', CONFIG.SUPABASE_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_KEY);
  if (corpo !== null) x.setRequestHeader('Content-Type', 'application/json');
  if (extras) for (var k in extras) if (extras.hasOwnProperty(k)) x.setRequestHeader(k, extras[k]);
  x.timeout = 20000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300) {
      var d = null;
      try { d = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) { d = null; }
      if (ok) ok(d);
    } else if (falha) {
      var msg = x.status + ' ';
      try { var j = JSON.parse(x.responseText); msg += (j.erro || j.message || ''); } catch (e2) { msg += x.responseText; }
      falha(msg);
    }
  };
  x.send(corpo !== null ? JSON.stringify(corpo) : null);
}

/* =================== estado =================== */
var estado = {
  dia: null,          // dia (AAAA-MM-DD) da daily mostrada
  texto: '',
  ticks: {},          // chave -> true
  monday: null,
  mondayErro: null,
  online: true,
  ultimaAssinatura: ''
};

/* =================== leitura da daily =================== */
function lerDados(texto) {
  var linhas = String(texto).split(/\r?\n/);
  var r = { data: '', pessoas: [] };
  var atual = null, grupo = '';
  for (var i = 0; i < linhas.length; i++) {
    var l = trim(linhas[i]);
    if (!l) continue;
    var m = l.match(/^data\s*:\s*(.*)$/i);
    if (m) { r.data = m[1]; continue; }
    if (l.charAt(0) === '@') {
      var partes = trim(l.substring(1)).split('|');
      atual = { nome: trim(partes[0]), status: partes.length > 1 ? trim(partes[1]) : '', itens: [] };
      grupo = '';
      r.pessoas.push(atual);
      continue;
    }
    if (!atual) continue;
    if (l.charAt(0) === '#') { grupo = trim(l.substring(1)); atual.itens.push({ tipo: 'grupo', texto: grupo }); continue; }
    var alerta = false;
    if (l.charAt(0) === '!') { alerta = true; l = trim(l.substring(1)); }
    if (l.charAt(0) === '-' || l.charAt(0) === '*') l = trim(l.substring(1));
    var num = null, mn = l.match(/^(\d+)\s+(.+)$/);
    if (mn) { num = mn[1]; l = mn[2]; }
    var chave = (atual.nome + '|' + grupo + '|' + (num !== null ? num + ' ' : '') + l).toLowerCase();
    atual.itens.push({ tipo: 'item', texto: l, num: num, alerta: alerta, chave: chave });
  }
  return r;
}

/* =================== desenho =================== */
function htmlCard(p, idx) {
  var cor = CORES[idx % CORES.length];
  var folga = /folga|f[eé]rias|ausente|atestado/i.test(p.status);
  var temAlerta = false, n = 0, feitos = 0, h = '';
  for (var i = 0; i < p.itens.length; i++) {
    var it = p.itens[i];
    if (it.tipo === 'grupo') { h += '<div class="grupo">' + esc(it.texto) + '</div>'; continue; }
    n++;
    var feito = !!estado.ticks[it.chave];
    if (feito) feitos++;
    if (it.alerta && !feito) temAlerta = true;
    var marca = it.num !== null
      ? '<span class="badge' + (it.num === '0' ? ' zero' : '') + '">' + esc(it.num) + '</span>'
      : '<span class="bol"></span><span class="ck">&#10003;</span>';
    h += '<div class="item' + (it.alerta ? ' alerta' : '') + (feito ? ' feito' : '') + '" data-chave="' + esc(it.chave) + '">' + marca + esc(it.texto) + '</div>';
  }
  var qtd = '';
  if (!folga && n) qtd = '<span class="qtd' + (feitos === n ? ' tudo' : '') + '">' + (feitos === n ? '&#10003; ' : '') + feitos + '/' + n + '</span>';
  var topo = '<div class="nome" style="color:' + cor + '">' + esc(p.nome) + qtd + '</div>';
  if (p.status) h = '<span class="tag">' + esc(p.status) + '</span>' + h;
  return {
    html: '<div class="card' + (folga ? ' folga' : '') + (temAlerta ? ' temalerta' : '') + '" style="border-top-color:' + cor + '">' + topo + h + '</div>',
    n: folga ? 0 : n, feitos: folga ? 0 : feitos, folga: folga
  };
}

function escalaTopo() {
  var w = window.innerWidth || document.documentElement.clientWidth || 1920;
  document.getElementById('topo').style.fontSize = (16 * w / 1920).toFixed(2) + 'px';
}
function montarTopo(d, totalItens, totalFeitos) {
  escalaTopo();
  var data = d.data || (estado.dia ? isoParaBR(estado.dia) : '');
  var antiga = estado.dia && estado.dia !== hojeISO();
  var h = '<div class="linha">' +
    '<div class="tit">TO-DO <span class="ouro">DO DIA</span><span class="sub">Daily ' + esc(data) + (antiga ? ' (ainda não tem a de hoje)' : '') + '</span></div>' +
    '<div class="dir">' +
      '<div class="bloco"><div class="num' + (totalItens && totalFeitos === totalItens ? ' verde' : '') + '">' + totalFeitos + '<span style="color:#6f6f75">/' + totalItens + '</span></div><div class="lbl">tarefas feitas</div></div>' +
      htmlDolar() +
      '<div class="bloco"><div class="relogio" id="relogio"></div><div class="lbl" id="diasem"></div></div>' +
    '</div></div>';
  h += htmlMonday();
  document.getElementById('topo').innerHTML = h;
  tick();
}

function htmlDolar() {
  var d = estado.dolar;
  if (!d) return '';
  var v = d.valor.toFixed(2).replace('.', ',');
  var pct = (d.variacao_pct === null || isNaN(d.variacao_pct)) ? '' : d.variacao_pct;
  var lbl = 'dólar' + (d.fonte && d.fonte !== 'comercial' ? ' ' + esc(d.fonte) : '');
  if (pct !== '') {
    var seta = pct > 0 ? '&#9650; ' : (pct < 0 ? '&#9660; ' : '');
    lbl += ' <span class="' + (pct > 0 ? 'sobe' : (pct < 0 ? 'desce' : '')) + '">' + seta + Math.abs(pct).toFixed(2).replace('.', ',') + '%</span>';
  }
  return '<div class="bloco dolar"><div class="num"><small>R$</small>' + v + '</div><div class="lbl">' + lbl + '</div></div>';
}

function htmlMonday() {
  var m = estado.monday;
  if (!m) {
    return '<div id="monday" class="erro" onclick="verProjetos()"><span class="mtit">FUP pendente</span><span class="mtot">&ndash;</span>' +
      '<span class="mhora">' + (estado.mondayErro ? 'monday indisponível' : 'carregando...') + '</span></div>';
  }
  var h = '<div id="monday" onclick="verProjetos()"><span class="mtit">FUP pendente</span>' +
    '<span class="mtot">' + m.total_sem_comentario + ' <small>de ' + m.total_projetos + '</small></span>';
  for (var i = 0; i < m.pessoas.length; i++) {
    var p = m.pessoas[i];
    h += '<span class="chip' + (p.sem === 0 ? ' ok' : '') + '">' + esc(p.nome) + '<b>' + p.sem + '</b></span>';
  }
  var hc = new Date(m.calculado_em);
  h += '<span class="mhora">monday ' + (isNaN(hc.getTime()) ? '' : doisDig(hc.getHours()) + ':' + doisDig(hc.getMinutes())) + (estado.mondayErro ? ' (sem atualizar)' : '') + '</span></div>';
  return h;
}

function tick() {
  var a = new Date();
  var r = document.getElementById('relogio');
  if (r) r.innerHTML = doisDig(a.getHours()) + ':' + doisDig(a.getMinutes());
  var s = document.getElementById('diasem');
  if (s) s.innerHTML = DIAS[a.getDay()];
}

/* Mede cada card numa coluna da largura certa */
function medir(cards, nCol, tam) {
  var quadro = document.getElementById('quadro');
  var w = (100 / nCol).toFixed(4) + '%', h = '', i;
  quadro.style.fontSize = tam + 'px';
  for (i = 0; i < cards.length; i++) h += cards[i].html;
  quadro.innerHTML = '<div class="coluna" style="width:' + w + '">' + h + '</div>';
  var filhos = quadro.firstChild.childNodes, alt = [];
  for (i = 0; i < filhos.length; i++) alt.push(filhos[i].offsetHeight + 16);
  return alt;
}
function distribuir(alt, nCol) {
  var cols = [], alturas = [], i, c;
  for (i = 0; i < nCol; i++) { cols.push([]); alturas.push(0); }
  for (i = 0; i < alt.length; i++) {
    var menor = 0;
    for (c = 1; c < nCol; c++) if (alturas[c] < alturas[menor]) menor = c;
    cols[menor].push(i);
    alturas[menor] += alt[i];
  }
  var max = 0;
  for (c = 0; c < nCol; c++) if (alturas[c] > max) max = alturas[c];
  return { cols: cols, max: max };
}
function desenhar(cards, nCol, tam, cols) {
  var quadro = document.getElementById('quadro');
  var w = (100 / nCol).toFixed(4) + '%', h = '', i, j;
  quadro.style.fontSize = tam + 'px';
  for (i = 0; i < nCol; i++) {
    h += '<div class="coluna" style="width:' + w + '">';
    for (j = 0; j < cols[i].length; j++) h += cards[cols[i][j]].html;
    h += '</div>';
  }
  quadro.innerHTML = h + '<div class="limpa"></div>';
}
var layoutAnterior = null;
function layout(cards, reaproveitar) {
  if (reaproveitar && layoutAnterior && layoutAnterior.qtd === cards.length) {
    desenhar(cards, layoutAnterior.n, layoutAnterior.tam, layoutAnterior.cols);
    return;
  }
  var alturaTela = window.innerHeight || document.documentElement.clientHeight;
  var disponivel = alturaTela - document.getElementById('topo').offsetHeight - 36;
  var opcoes = cards.length <= 4 ? [2, 3, 4] : (cards.length <= 8 ? [3, 4, 5] : [4, 5, 6]);
  var melhor = null, k, tam;
  for (k = 0; k < opcoes.length; k++) {
    for (tam = 44; tam >= 14; tam--) {
      var d = distribuir(medir(cards, opcoes[k], tam), opcoes[k]);
      if (d.max <= disponivel) {
        if (!melhor || tam > melhor.tam) melhor = { n: opcoes[k], tam: tam, cols: d.cols };
        break;
      }
    }
  }
  if (!melhor) {
    var nn = opcoes[opcoes.length - 1];
    melhor = { n: nn, tam: 14, cols: distribuir(medir(cards, nn, 14), nn).cols };
  }
  melhor.qtd = cards.length;
  layoutAnterior = melhor;
  desenhar(cards, melhor.n, melhor.tam, melhor.cols);
}

/* reaproveitar=true: só mudou tick/monday, mantém o layout (sem "pular" na tela) */
function render(reaproveitar) {
  var d = lerDados(estado.texto);
  var cards = [], tot = 0, feitos = 0, i;
  for (i = 0; i < d.pessoas.length; i++) {
    var c = htmlCard(d.pessoas[i], i);
    cards.push(c); tot += c.n; feitos += c.feitos;
  }
  montarTopo(d, tot, feitos);
  layout(cards, reaproveitar);
  var st = document.getElementById('status');
  st.className = estado.online ? '' : 'off';
  st.innerHTML = estado.online ? 'ao vivo' : 'sem conexão com o banco &ndash; mostrando o último dado';
}

/* =================== dados do banco =================== */
function carregar(primeira) {
  ajax('GET', '/rest/v1/tv_daily?select=dia,texto&order=dia.desc&limit=1', null, null, function (linhas) {
    var dia, texto;
    if (linhas && linhas.length) { dia = linhas[0].dia; texto = linhas[0].texto; }
    else { dia = hojeISO(); texto = document.getElementById('exemplo').text; }
    ajax('GET', '/rest/v1/tv_ticks?select=chave,feito&dia=eq.' + dia, null, null, function (t) {
      var ticks = {};
      for (var i = 0; t && i < t.length; i++) if (t[i].feito) ticks[t[i].chave] = true;
      var mudouTexto = texto !== estado.texto || dia !== estado.dia;
      var assin = dia + '\n' + texto + '\n' + JSON.stringify(ticks);
      estado.online = true;
      if (assin !== estado.ultimaAssinatura || primeira) {
        estado.dia = dia; estado.texto = texto; estado.ticks = ticks; estado.ultimaAssinatura = assin;
        render(!mudouTexto && !primeira);
      }
    }, falhouBanco);
  }, falhouBanco);
}
function falhouBanco() {
  estado.online = false;
  if (!estado.texto) { estado.texto = document.getElementById('exemplo').text; estado.dia = hojeISO(); render(false); }
  else render(true);
}
function carregarDolar() {
  var x = new XMLHttpRequest();
  x.open('GET', CONFIG.SUPABASE_URL + '/functions/v1/tv-dolar', true);
  x.setRequestHeader('apikey', CONFIG.SUPABASE_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_KEY);
  x.timeout = 30000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
    if (x.status === 200 && d && typeof d.valor === 'number') { estado.dolar = d; if (estado.texto) render(true); }
  };
  x.send(null);
}
function carregarMonday() {
  var x = new XMLHttpRequest();
  x.open('GET', CONFIG.SUPABASE_URL + '/functions/v1/tv-monday', true);
  x.setRequestHeader('apikey', CONFIG.SUPABASE_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_KEY);
  x.timeout = 60000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
    if (x.status === 200 && d && typeof d.total_sem_comentario === 'number') { estado.monday = d; estado.mondayErro = null; }
    else estado.mondayErro = (d && d.erro) || ('erro ' + x.status);
    if (estado.texto) render(true);
  };
  x.send(null);
}

/* =================== interação (PC) =================== */
function marcar(chave, feito) {
  if (feito) estado.ticks[chave] = true; else delete estado.ticks[chave];
  render(true);
  ajax('POST', '/rest/v1/tv_ticks?on_conflict=dia,chave', { dia: estado.dia, chave: chave, feito: feito, atualizado_em: new Date().toISOString() },
    { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    function () { estado.ultimaAssinatura = ''; },
    function (e) { alert('Não consegui salvar o tick: ' + e); carregar(false); });
}
document.getElementById('quadro').onclick = function (ev) {
  if (MODO_TV) return;
  ev = ev || window.event;
  var el = ev.target || ev.srcElement;
  while (el && el !== this) {
    if (el.className && (' ' + el.className + ' ').indexOf(' item ') >= 0) {
      var chave = el.getAttribute('data-chave');
      marcar(chave, !estado.ticks[chave]);
      return;
    }
    el = el.parentNode;
  }
};

function fecharJanela() { document.getElementById('janela').style.display = 'none'; }
function abrirEditor() {
  var c = document.getElementById('caixa');
  c.innerHTML = '<h2>Daily do dia</h2>' +
    '<div>Dia: <input type="date" id="edDia" value="' + hojeISO() + '"></div>' +
    '<div class="ajuda"><code>DATA: 11/11</code> data no topo &middot; <code>@ Nome</code> pessoa &middot; <code>@ Nome | Folga</code> folga &middot; ' +
    '<code># Grupo</code> subtítulo &middot; número no começo vira destaque &middot; <code>! texto</code> alerta. ' +
    'Os ticks de tarefas que continuarem com o mesmo texto são mantidos no mesmo dia.</div>' +
    '<textarea id="edTexto"></textarea>' +
    '<div style="margin-top:14px"><button class="btn" onclick="salvarDaily()">Salvar e mostrar na TV</button>' +
    '<button class="btn sec" onclick="fecharJanela()">Cancelar</button></div>';
  var texto = estado.texto;
  if (estado.dia !== hojeISO()) texto = texto.replace(/^\s*DATA\s*:.*$/im, 'DATA: ' + isoParaBR(hojeISO()));
  document.getElementById('edTexto').value = texto;
  document.getElementById('janela').style.display = 'block';
}
function salvarDaily() {
  var dia = document.getElementById('edDia').value || hojeISO();
  var texto = document.getElementById('edTexto').value;
  if (!/^\s*DATA\s*:/im.test(texto)) texto = 'DATA: ' + isoParaBR(dia) + '\n' + texto;
  ajax('POST', '/rest/v1/tv_daily?on_conflict=dia', { dia: dia, texto: texto, atualizado_em: new Date().toISOString() },
    { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    function () { fecharJanela(); estado.ultimaAssinatura = ''; carregar(true); },
    function (e) { alert('Não consegui salvar a daily: ' + e); });
}
function verProjetos() {
  if (MODO_TV) return;
  var m = estado.monday, c = document.getElementById('caixa');
  var h = '<h2>FUP pendente hoje</h2>';
  if (!m) h += '<p>' + esc(estado.mondayErro || 'Ainda carregando...') + '</p>';
  else {
    var qs = '';
    for (var q = 0; m.quadros && q < m.quadros.length; q++) qs += (q ? ' &middot; ' : '') + esc(m.quadros[q].nome) + ': ' + m.quadros[q].sem + ' de ' + m.quadros[q].total;
    h += '<div class="ajuda">Só o grupo Tarefas Pendentes de cada quadro (pausadas e finalizadas não entram). ' +
      'Pietra, Rhany, Carol e Jana: Produção, Financeiro Inicial e Final, pela coluna Delivery FUP. Helo: Contrato e Auditorias, pela coluna Delivery, e o quadro QC inteiro, menos os itens em Aprovação QC, que contam para o quarteto pela coluna Delivery FUP.<br>' + qs + '<br>' +
      'Conta só comentário de pessoa feito hoje (os automáticos com 🤖 não contam).</div><div class="lista">';
    for (var i = 0; i < m.pessoas.length; i++) {
      var p = m.pessoas[i];
      h += '<h3>' + esc(p.nome) + ': ' + p.sem + ' de ' + p.total + '</h3><ul>';
      for (var j = 0; j < p.projetos.length; j++) h += '<li>' + esc(p.projetos[j]) + '</li>';
      h += '</ul>';
    }
    h += '</div>';
  }
  h += '<button class="btn sec" onclick="fecharJanela()">Fechar</button>';
  c.innerHTML = h;
  document.getElementById('janela').style.display = 'block';
}
function abrirTV() {
  var u = window.location.href.split('#')[0];
  window.open(u + (u.indexOf('?') >= 0 ? '&' : '?') + 'tv', '_blank');
}

/* =================== início =================== */
/* =================== tela cheia (TV) =================== */
function elementoCheio() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || null;
}
function alternarTelaCheia() {
  var el = document.documentElement;
  if (!elementoCheio()) {
    var pedir = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (pedir) { try { pedir.call(el); } catch (e) {} }
  } else {
    var sair = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    if (sair) { try { sair.call(document); } catch (e2) {} }
  }
}
function mudouTelaCheia() {
  document.body.className = (MODO_TV ? 'tv' : 'pc') + (elementoCheio() ? ' cheia' : '');
  layoutAnterior = null;
  setTimeout(function () { if (estado.texto) render(false); }, 400);
}
document.addEventListener('fullscreenchange', mudouTelaCheia, false);
document.addEventListener('webkitfullscreenchange', mudouTelaCheia, false);
/* No controle remoto: OK/Enter alterna a tela cheia */
document.addEventListener('keydown', function (ev) {
  if (!MODO_TV) return;
  var k = ev.keyCode || ev.which;
  var alvo = ev.target || ev.srcElement;
  if (alvo && alvo.id === 'telaCheia') return; // o próprio botão já trata o OK
  if (k === 13) { alternarTelaCheia(); if (ev.preventDefault) ev.preventDefault(); }
}, false);

window.onload = function () {
  if (MODO_TV) { try { document.getElementById('telaCheia').focus(); } catch (e) {} }
  carregar(true);
  carregarMonday();
  setInterval(function () { carregar(false); }, CONFIG.SEGUNDOS_TICKS * 1000);
  setInterval(carregarMonday, CONFIG.SEGUNDOS_MONDAY * 1000);
  carregarDolar();
  setInterval(carregarDolar, CONFIG.SEGUNDOS_DOLAR * 1000);
  setInterval(tick, 10000);
  // Na TV, recarrega a página inteira a cada 6 h (evita o navegador da TV ir ficando lento)
  if (MODO_TV) setTimeout(function () { window.location.reload(true); }, 6 * 3600 * 1000);
};
var tmResize = null;
window.onresize = function () {
  clearTimeout(tmResize);
  tmResize = setTimeout(function () { layoutAnterior = null; if (estado.texto) render(false); }, 300);
};
</script>
